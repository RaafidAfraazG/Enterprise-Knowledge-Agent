name: CI
on:
  push:
    branches: ['**']
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: pytest -q
      - run: docker build .
  eval:
    needs: test
    runs-on: ubuntu-latest
    env:
      AZURE_OPENAI_API_KEY: ${{ secrets.AZURE_OPENAI_API_KEY }}
      AZURE_OPENAI_ENDPOINT: ${{ secrets.AZURE_OPENAI_ENDPOINT }}
      AZURE_OPENAI_CHAT_DEPLOYMENT: ${{ vars.AZURE_OPENAI_CHAT_DEPLOYMENT }}
      AZURE_OPENAI_EMBED_DEPLOYMENT: ${{ vars.AZURE_OPENAI_EMBED_DEPLOYMENT }}
      AZURE_OPENAI_API_VERSION: ${{ vars.AZURE_OPENAI_API_VERSION || '2024-02-01' }}
      QDRANT_URL: ${{ secrets.QDRANT_URL }}
      QDRANT_API_KEY: ${{ secrets.QDRANT_API_KEY }}
      QDRANT_COLLECTION: eval_${{ github.run_id }}
      LLM_PROVIDER: azure
      PROFILE: ${{ vars.APP_PROFILE || 'baseline' }}
      AZURE_OPENAI_ROUTER_DEPLOYMENT: ${{ vars.AZURE_OPENAI_ROUTER_DEPLOYMENT }}
      LANGFUSE_PUBLIC_KEY: ${{ secrets.LANGFUSE_PUBLIC_KEY }}
      LANGFUSE_SECRET_KEY: ${{ secrets.LANGFUSE_SECRET_KEY }}
      LANGFUSE_HOST: ${{ vars.LANGFUSE_HOST || 'https://cloud.langfuse.com' }}
      EVAL_MIN_ACCURACY: ${{ vars.EVAL_MIN_ACCURACY || '0.70' }}
    steps:
      - name: Check cloud credentials
        id: credentials
        shell: bash
        run: |
          if [[ -n "${AZURE_OPENAI_API_KEY:-}" && -n "${AZURE_OPENAI_ENDPOINT:-}" && -n "${QDRANT_URL:-}" && -n "${QDRANT_API_KEY:-}" ]]; then
            echo 'configured=true' >> "$GITHUB_OUTPUT"
          else
            echo 'configured=false' >> "$GITHUB_OUTPUT"
            echo '::notice::Cloud credentials not configured, skipping eval. See docs/SETUP.md'
            echo 'Cloud credentials not configured, skipping eval. See docs/SETUP.md' >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/checkout@v4
        if: steps.credentials.outputs.configured == 'true'
      - uses: actions/setup-python@v5
        if: steps.credentials.outputs.configured == 'true'
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install
        if: steps.credentials.outputs.configured == 'true'
        run: pip install -e ".[dev]"
      - name: Smoke test cloud services
        if: steps.credentials.outputs.configured == 'true'
        run: python scripts/smoke_azure.py
      - name: Evaluate
        if: steps.credentials.outputs.configured == 'true'
        run: python -m eval.run --provider azure
      - uses: actions/upload-artifact@v4
        if: always() && steps.credentials.outputs.configured == 'true'
        with:
          name: evaluation-${{ github.run_id }}
          path: eval/results/latest.json
          if-no-files-found: warn
  deploy:
    needs: eval
    concurrency:
      group: deploy-${{ github.repository }}
      cancel-in-progress: false
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    env:
      AZURE_CREDENTIALS: ${{ secrets.AZURE_CREDENTIALS }}
      AZURE_OPENAI_API_KEY: ${{ secrets.AZURE_OPENAI_API_KEY }}
      AZURE_OPENAI_ENDPOINT: ${{ secrets.AZURE_OPENAI_ENDPOINT }}
      QDRANT_URL: ${{ secrets.QDRANT_URL }}
      QDRANT_API_KEY: ${{ secrets.QDRANT_API_KEY }}
      AZURE_RG: ${{ vars.AZURE_RG }}
      AZURE_ACR_NAME: ${{ vars.AZURE_ACR_NAME }}
      AZURE_CONTAINERAPP_NAME: ${{ vars.AZURE_CONTAINERAPP_NAME }}
    steps:
      - name: Check deployment credentials
        id: credentials
        shell: bash
        run: |
          if [[ -n "${AZURE_OPENAI_API_KEY:-}" && -n "${AZURE_OPENAI_ENDPOINT:-}" && -n "${QDRANT_URL:-}" && -n "${QDRANT_API_KEY:-}" && -n "${AZURE_CREDENTIALS:-}" && -n "${AZURE_RG:-}" && -n "${AZURE_ACR_NAME:-}" && -n "${AZURE_CONTAINERAPP_NAME:-}" ]]; then
            echo 'configured=true' >> "$GITHUB_OUTPUT"
          else
            echo 'configured=false' >> "$GITHUB_OUTPUT"
            echo '::notice::Cloud credentials not configured, skipping deploy. See docs/SETUP.md'
            echo 'Cloud credentials not configured, skipping deploy. See docs/SETUP.md' >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/checkout@v4
        if: steps.credentials.outputs.configured == 'true'
      - uses: azure/login@v2
        if: steps.credentials.outputs.configured == 'true'
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}
      - name: Build and deploy
        if: steps.credentials.outputs.configured == 'true'
        shell: bash
        run: |
          set -euo pipefail
          az extension add --name containerapp --upgrade --only-show-errors
          az acr build --registry "$AZURE_ACR_NAME" --resource-group "$AZURE_RG" \
            --image "kagent:$GITHUB_SHA" --image kagent:latest .
          az containerapp ingress update --resource-group "$AZURE_RG" \
            --name "$AZURE_CONTAINERAPP_NAME" --target-port 8000 --output none
          az containerapp update --resource-group "$AZURE_RG" --name "$AZURE_CONTAINERAPP_NAME" \
            --image "${AZURE_ACR_NAME}.azurecr.io/kagent:$GITHUB_SHA" --output none
          fqdn=$(az containerapp show --resource-group "$AZURE_RG" --name "$AZURE_CONTAINERAPP_NAME" \
            --query properties.configuration.ingress.fqdn --output tsv)
          python scripts/smoke_http.py "https://$fqdn"
          echo "Live application: https://$fqdn" >> "$GITHUB_STEP_SUMMARY"
