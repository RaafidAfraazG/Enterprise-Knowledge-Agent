[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "kagent"
version = "0.1.0"
description = "An offline-first enterprise knowledge agent"
requires-python = ">=3.11"
dependencies = [
  "langgraph>=1.0,<2", "langchain>=1.0,<2", "fastapi>=0.115,<1",
  "uvicorn>=0.30,<1", "qdrant-client>=1.12,<2", "pydantic-settings>=2.5,<3",
  "sqlglot>=26,<31", "openai>=1.60,<3", "langfuse==2.60.10",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.9,<1", "httpx>=0.27,<1", "pyyaml>=6,<7"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I"]
